services:
  mysql:
    image: mysql:8.0
    container_name: dacs-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - dacs_mysql_data:/var/lib/mysql
      - ./football_pitch_db.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  dacs_mysql_data: